<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 0; }
        .btn-recon { background: #238636; color: white; border: none; font-weight: bold; }
        .vuln-found { color: #f85149; }
        .vuln-clean { color: #3fb950; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-4">> RECON-X_VULN_SCANNER</h2>
        <div class="card p-4 mb-4 shadow">
            <form method="POST" class="input-group">
                <input type="text" name="target" class="form-control bg-dark text-light border-secondary" placeholder="Target IP (e.g. 127.0.0.1)" required>
                <button class="btn btn-recon">INITIATE_SCAN</button>
            </form>
        </div>

        {% if results %}
            {% for host in results %}
            <div class="card p-4">
                <h4>Target: {{ host.ip }}</h4>
                <table class="table table-dark table-hover mt-3">
                    <thead><tr><th>Port</th><th>Service</th><th>Vulnerability Status</th></tr></thead>
                    <tbody>
                        {% for p in host.ports %}
                        <tr>
                            <td>{{ p.port }}</td>
                            <td>{{ p.service }}</td>
                            <td class="{{ 'vuln-found' if 'CVE' in p.vuln else 'vuln-clean' }}">
                                {{ 'Exploits Found' if 'CVE' in p.vuln else 'Secure' }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% endfor %}
        {% endif %}
    </div>
</body>
</html>
